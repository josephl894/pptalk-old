[project]
name = "narrator"
version = "0.0.1"
description = "PPTX -> narrated MP4 pipeline"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
    "pymupdf>=1.24.0",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "typer>=0.15.0",
    "python-dotenv>=1.0.1",
    "pillow>=11.0.0",
    "rich>=13.9.0",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "supabase>=2.25.1",
    "uuid7>=0.1.0",
]

[project.scripts]
narrator = "narrator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
